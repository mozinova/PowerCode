# Builds the Windows installers on every push to a branch, for trying a change
# before it is tagged. They are kept as workflow artifacts (Actions → the run →
# Artifacts), never attached to a release. Tags build Windows and Linux in
# release.yml.

name: Windows build

on:
  push:
    branches:
      - "**"
    # Text-only changes need no new installer.
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch replaces the build in progress.
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows (x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows-latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The bundled Node.js and the extension host are prepared by `beforeBuildCommand`.
      - name: Build
        run: bun tauri build --bundles nsis,msi

      - name: Name the artifact
        id: name
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "artifact=PowerCode-${version}-${GITHUB_SHA::7}-windows-x64" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
